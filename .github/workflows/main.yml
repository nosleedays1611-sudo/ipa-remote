name: Build Injetor REMOTE IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and prepare source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf source build Payload
          mkdir -p source

          SOURCE_ZIP=""

          while IFS= read -r ZIP; do
            if unzip -Z1 "$ZIP" 2>/dev/null \
              | grep -qE '(^|/)ThreeOneOSFive\.xcodeproj/project\.pbxproj$'; then
              SOURCE_ZIP="$ZIP"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              -print
          )

          if [ -n "$SOURCE_ZIP" ]; then
            echo "========================================"
            echo "SOURCE ZIP"
            echo "========================================"
            echo "$SOURCE_ZIP"

            unzip -q "$SOURCE_ZIP" \
              -d "$GITHUB_WORKSPACE/source" \
              -x '__MACOSX/*' '*/__MACOSX/*'

            find "$GITHUB_WORKSPACE/source" \
              -type f \
              -name '._*' \
              -delete || true

            SEARCH_ROOT="$GITHUB_WORKSPACE/source"
          else
            echo "Nenhum ZIP encontrado."
            echo "Usando projeto extraido diretamente no repositorio."

            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          PROJECT="$(find "$SEARCH_ROOT" \
            -type d \
            -name 'ThreeOneOSFive.xcodeproj' \
            ! -path '*/__MACOSX/*' \
            ! -path '*/build/*' \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERRO: ThreeOneOSFive.xcodeproj nao encontrado."

            echo
            echo "Arquivos encontrados:"
            find "$SEARCH_ROOT" \
              -maxdepth 5 \
              -type f \
              -print | head -n 300

            exit 1
          fi

          ROOT="$(dirname "$PROJECT")"
          APPDIR="$ROOT/ThreeOneOSFive"

          echo
          echo "========================================"
          echo "PROJETO"
          echo "========================================"

          echo "PROJECT: $PROJECT"
          echo "ROOT:    $ROOT"
          echo "APPDIR:  $APPDIR"

          # ------------------------------------------------------
          # LOCALIZAR REMOTEAUTH.MM
          # ------------------------------------------------------

          AUTH_SOURCE="$(find "$ROOT" \
            -type f \
            -name 'RemoteAuth.mm' \
            ! -path '*/__MACOSX/*' \
            -print -quit)"

          if [ -z "$AUTH_SOURCE" ]; then

            AUTH_SOURCE="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'RemoteAuth.mm' \
              ! -path '*/__MACOSX/*' \
              ! -path '*/build/*' \
              -print -quit)"

          fi

          if [ -z "$AUTH_SOURCE" ]; then
            echo
            echo "========================================"
            echo "ERRO"
            echo "========================================"

            echo "RemoteAuth.mm nao encontrada."

            echo
            echo "Procurando arquivos RemoteAuth existentes:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -iname '*remote*auth*' \
                -o \
                -iname '*.mm' \
              \) \
              -print || true

            exit 1
          fi

          # ------------------------------------------------------
          # LOCALIZAR ICON.GIF
          # ------------------------------------------------------

          AUTH_GIF="$(find "$(dirname "$AUTH_SOURCE")" \
            -maxdepth 2 \
            -type f \
            -name 'icon.gif' \
            -print -quit || true)"

          if [ -z "$AUTH_GIF" ]; then

            AUTH_GIF="$(find "$ROOT" \
              -type f \
              -name 'icon.gif' \
              ! -path '*/__MACOSX/*' \
              -print -quit)"

          fi

          if [ -z "$AUTH_GIF" ]; then

            AUTH_GIF="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'icon.gif' \
              ! -path '*/__MACOSX/*' \
              ! -path '*/build/*' \
              -print -quit)"

          fi

          if [ -z "$AUTH_GIF" ]; then
            echo
            echo "========================================"
            echo "ERRO"
            echo "========================================"

            echo "icon.gif nao encontrado."

            find "$GITHUB_WORKSPACE" \
              -type f \
              \( \
                -iname '*.gif' \
                -o \
                -iname '*icon*' \
              \) \
              -print || true

            exit 1
          fi

          # ------------------------------------------------------
          # DESTINO DA DYLIB
          # ------------------------------------------------------

          AUTH_DIR="$(dirname "$AUTH_SOURCE")"
          AUTH="$AUTH_DIR/RemoteAuth.dylib"

          PATCHES_DIR="$APPDIR/Patches"
          GENERATED_DIR="$APPDIR/Generated"

          VAULT="$GENERATED_DIR/patchvault.bin"
          RESOURCE_VAULT="$GENERATED_DIR/resourcevault.bin"

          PATCH_BRIDGE="$APPDIR/helpers/PatchVaultBridge.generated.c"
          VAULT_GENERATOR="$ROOT/tools/build_patch_vault.py"

          mkdir -p "$PATCHES_DIR"
          mkdir -p "$GENERATED_DIR"

          echo
          echo "========================================"
          echo "AUTH LOCALIZADA"
          echo "========================================"

          echo "RemoteAuth.mm:"
          echo "$AUTH_SOURCE"

          echo
          echo "icon.gif:"
          echo "$AUTH_GIF"

          echo
          echo "RemoteAuth.dylib sera criada em:"
          echo "$AUTH"

          # ------------------------------------------------------
          # EXPORTAR VARIAVEIS
          # ------------------------------------------------------

          {
            echo "PROJECT=$PROJECT"
            echo "ROOT=$ROOT"
            echo "APPDIR=$APPDIR"

            echo "AUTH_SOURCE=$AUTH_SOURCE"
            echo "AUTH_GIF=$AUTH_GIF"
            echo "AUTH=$AUTH"

            echo "PATCHES_DIR=$PATCHES_DIR"
            echo "GENERATED_DIR=$GENERATED_DIR"

            echo "VAULT=$VAULT"
            echo "RESOURCE_VAULT=$RESOURCE_VAULT"

            echo "PATCH_BRIDGE=$PATCH_BRIDGE"
            echo "VAULT_GENERATOR=$VAULT_GENERATOR"
          } >> "$GITHUB_ENV"

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version

          echo
          echo "SDKs:"
          xcodebuild -showsdks

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build RemoteAuth dylib
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "BUILD REMOTEAUTH"
          echo "========================================"

          echo "SOURCE:"
          echo "$AUTH_SOURCE"

          echo
          echo "GIF:"
          echo "$AUTH_GIF"

          echo
          echo "OUTPUT:"
          echo "$AUTH"

          test -s "$AUTH_SOURCE" || {
            echo "ERRO: RemoteAuth.mm nao encontrada."
            exit 1
          }

          test -s "$AUTH_GIF" || {
            echo "ERRO: icon.gif nao encontrado."
            exit 1
          }

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          mkdir -p "$(dirname "$AUTH")"

          rm -f "$AUTH"

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fvisibility=hidden \
            -O2 \
            -dynamiclib \
            "$AUTH_SOURCE" \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -framework QuartzCore \
            -framework ImageIO \
            -framework CoreGraphics \
            -Wl,-install_name,@rpath/RemoteAuth.dylib \
            -Wl,-dead_strip \
            -Wl,-sectcreate,__DATA,__eaicon,"$AUTH_GIF" \
            -o "$AUTH"

          test -s "$AUTH" || {
            echo "ERRO: RemoteAuth.dylib nao foi criada."
            exit 1
          }

          echo
          echo "========================================"
          echo "DYLIB GERADA"
          echo "========================================"

          ls -lh "$AUTH"

          echo
          file "$AUTH"

          echo
          echo "Arquitetura:"
          lipo -info "$AUTH" || true

          echo
          echo "Dependencias:"
          otool -L "$AUTH"

          echo
          echo "GIF embutido:"
          otool -l "$AUTH" \
            | grep -A8 "__eaicon" || {
                echo "ERRO: secao __eaicon nao encontrada."
                exit 1
              }

          echo
          echo "SHA256:"
          shasum -a 256 "$AUTH"

      - name: Prepare patch vault
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PATCH VAULT"
          echo "========================================"

          test -s "$RESOURCE_VAULT" || {
            echo "ERRO: resourcevault.bin ausente:"
            echo "$RESOURCE_VAULT"
            exit 1
          }

          # Corrigir extensao duplicada, caso exista.
          find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105.3105' \
            | while IFS= read -r FILE; do

                NEW="${FILE%.3105}"

                echo "Renomeando:"
                echo "$FILE"
                echo "-> $NEW"

                mv "$FILE" "$NEW"
              done

          # Se remote.3105 nao estiver dentro da source,
          # procurar no repositorio.
          if [ ! -f "$PATCHES_DIR/remote.3105" ]; then

            REPO_PATCH="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'remote.3105' \
              ! -path "$PATCHES_DIR/*" \
              ! -path '*/__MACOSX/*' \
              -print -quit || true)"

            if [ -n "$REPO_PATCH" ]; then

              echo "remote.3105 encontrado:"
              echo "$REPO_PATCH"

              cp "$REPO_PATCH" \
                "$PATCHES_DIR/remote.3105"

            fi
          fi

          RAW_COUNT="$(find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            | wc -l \
            | tr -d ' ')"

          echo
          echo "Quantidade de .3105: $RAW_COUNT"

          if [ "$RAW_COUNT" -gt 0 ]; then

            if [ "$RAW_COUNT" -ne 1 ]; then

              echo "ERRO: REMOTE deve possuir exatamente 1 arquivo .3105."

              find "$PATCHES_DIR" \
                -maxdepth 1 \
                -type f \
                -name '*.3105' \
                -print

              exit 1
            fi

            test -s "$PATCHES_DIR/remote.3105" || {
              echo "ERRO: remote.3105 nao encontrado."
              exit 1
            }

            test -s "$VAULT_GENERATOR" || {
              echo "ERRO: build_patch_vault.py nao encontrado:"
              echo "$VAULT_GENERATOR"
              exit 1
            }

            VENV="$RUNNER_TEMP/patchvault-venv"

            rm -rf "$VENV"

            python3 -m venv "$VENV"

            "$VENV/bin/python" \
              -m pip install \
              --quiet \
              --upgrade pip cryptography

            "$VENV/bin/python" \
              "$VAULT_GENERATOR" \
              --input "$PATCHES_DIR" \
              --vault "$VAULT" \
              --bridge "$PATCH_BRIDGE"

            test -s "$VAULT" || {
              echo "ERRO: patchvault.bin nao foi gerado."
              exit 1
            }

            test -s "$PATCH_BRIDGE" || {
              echo "ERRO: PatchVaultBridge.generated.c nao foi gerado."
              exit 1
            }

            # Nenhum .3105 cru entra no app final.
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -delete

          else

            echo "Nenhum .3105 cru encontrado."

            test -s "$VAULT" || {
              echo "ERRO: patchvault.bin tambem nao existe."
              exit 1
            }

            test -s "$PATCH_BRIDGE" || {
              echo "ERRO: PatchVaultBridge.generated.c ausente."
              exit 1
            }

          fi

          echo
          echo "Patch vault:"
          ls -lh "$VAULT"

          echo
          echo "Resource vault:"
          ls -lh "$RESOURCE_VAULT"

      - name: Build unsigned Injetor
        shell: bash
        run: |
          set -uo pipefail

          echo "========================================"
          echo "BUILD INJETOR"
          echo "========================================"

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build 2>&1 \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then

            echo
            echo "========================================"
            echo "XCODEBUILD FALHOU"
            echo "========================================"

            grep -n -E \
              'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld ' \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -n 400 || true

            exit "$RC"
          fi

      - name: Validate Injetor
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          if [ -z "$APP" ]; then

            APP="$(find "$GITHUB_WORKSPACE/build" \
              -type d \
              -name '*.app' \
              -print -quit)"

          fi

          test -n "$APP" || {
            echo "ERRO: .app nao encontrado."
            exit 1
          }

          EXE="$APP/3105"

          if [ ! -f "$EXE" ]; then

            EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist")"

            EXE="$APP/$EXECUTABLE_NAME"

          fi

          EMBEDDED_AUTH="$APP/Frameworks/RemoteAuth.dylib"

          echo "========================================"
          echo "APP"
          echo "========================================"

          echo "$APP"

          echo
          echo "Executavel:"
          echo "$EXE"

          test -s "$EXE" || {
            echo "ERRO: executavel principal ausente."
            exit 1
          }

          test -s "$EMBEDDED_AUTH" || {
            echo "ERRO: RemoteAuth.dylib nao foi embutida em Frameworks."
            find "$APP" -maxdepth 4 -type f -print
            exit 1
          }

          echo
          echo "========================================"
          echo "REMOTEAUTH"
          echo "========================================"

          if ! otool -L "$EXE" \
            | grep -Fq '@rpath/RemoteAuth.dylib'; then

            echo "ERRO: executavel nao possui LC_LOAD_DYLIB para RemoteAuth."

            echo
            otool -L "$EXE"

            exit 1
          fi

          echo "RemoteAuth LC_LOAD_DYLIB: OK"

          echo
          echo "RemoteAuth embutida:"
          file "$EMBEDDED_AUTH"

          echo
          echo "========================================"
          echo "VAULTS"
          echo "========================================"

          otool -l "$EXE" \
            | grep -q 'sectname __pv3105' || {
              echo "ERRO: secao __pv3105 ausente."
              exit 1
            }

          otool -l "$EXE" \
            | grep -q 'sectname __rv3105' || {
              echo "ERRO: secao __rv3105 ausente."
              exit 1
            }

          echo "__pv3105: OK"
          echo "__rv3105: OK"

          RAW_APP="$(find "$APP" \
            -type f \
            -name '*.3105' \
            | wc -l \
            | tr -d ' ')"

          if [ "$RAW_APP" -ne 0 ]; then

            echo "ERRO: arquivo .3105 cru encontrado dentro do app."

            find "$APP" \
              -type f \
              -name '*.3105' \
              -print

            exit 1
          fi

          echo
          echo "========================================"
          echo "EXECUTAVEL"
          echo "========================================"

          file "$EXE"

          echo
          echo "Dependencias:"
          otool -L "$EXE"

          echo
          echo "SHA256 RemoteAuth:"
          shasum -a 256 "$EMBEDDED_AUTH"

      - name: Strip release symbols
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          if [ -z "$APP" ]; then

            APP="$(find "$GITHUB_WORKSPACE/build" \
              -type d \
              -name '*.app' \
              -print -quit)"

          fi

          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$APP/Info.plist")"

          EXE="$APP/$EXECUTABLE_NAME"

          strip -S -x "$EXE" || true

          # Limpeza de arquivos que nao precisam estar no pacote.
          rm -rf "$APP/Patches"
          rm -f "$APP/PkgInfo"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          if [ -z "$APP" ]; then

            APP="$(find "$GITHUB_WORKSPACE/build" \
              -type d \
              -name '*.app' \
              -print -quit)"

          fi

          test -n "$APP" || {
            echo "ERRO: .app nao encontrado para empacotamento."
            exit 1
          }

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" \
            "Payload/Injetor.app"

          IPA="Injetor-REMOTE-1.0.1-unsigned.ipa"

          rm -f "$IPA"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA"

          test -s "$IPA" || {
            echo "ERRO: IPA nao criada."
            exit 1
          }

          echo
          echo "========================================"
          echo "IPA FINAL"
          echo "========================================"

          unzip -l "$IPA" \
            | grep -F \
              'Payload/Injetor.app/Frameworks/RemoteAuth.dylib' || {
                echo "ERRO: RemoteAuth.dylib ausente da IPA final."
                exit 1
              }

          echo
          ls -lh "$IPA"

          echo
          echo "SHA256:"
          shasum -a 256 "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Injetor-REMOTE-unsigned
          path: Injetor-REMOTE-1.0.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-injetor-remote-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
