name: Build Injetor REMOTE Hardened IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf source build Payload
          mkdir -p source

          SOURCE_ZIP=""
          while IFS= read -r ZIP; do
            if unzip -Z1 "$ZIP" 2>/dev/null \
              | grep -qE '(^|/)ThreeOneOSFive\.xcodeproj/project\.pbxproj$'; then
              SOURCE_ZIP="$ZIP"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.zip' -print)

          if [ -n "$SOURCE_ZIP" ]; then
            echo "Source ZIP: $SOURCE_ZIP"
            unzip -q "$SOURCE_ZIP" -d "$GITHUB_WORKSPACE/source" \
              -x '__MACOSX/*' '*/__MACOSX/*'
            find "$GITHUB_WORKSPACE/source" -type f -name '._*' -delete || true
            SEARCH_ROOT="$GITHUB_WORKSPACE/source"
          else
            echo "Projeto já extraído no repositório."
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          PROJECT="$(find "$SEARCH_ROOT" \
            -type d -name 'ThreeOneOSFive.xcodeproj' \
            ! -path '*/__MACOSX/*' ! -path '*/build/*' \
            -print -quit)"

          test -n "$PROJECT" || {
            echo 'ERRO: projeto não encontrado.'
            exit 1
          }

          ROOT="$(dirname "$PROJECT")"
          APPDIR="$ROOT/ThreeOneOSFive"

          AUTHSRC="$ROOT/AuthSource/RemoteAuth.mm"
          AUTHICON="$ROOT/AuthSource/icon.gif"

          AUTH="$APPDIR/Auth/RemoteAuth.dylib"

          AUTH_INTEGRITY="$APPDIR/helpers/AuthIntegrity.generated.swift"
          AUTH_GENERATOR="$ROOT/tools/generate_auth_integrity.py"

          PATCHES_DIR="$APPDIR/Patches"
          GENERATED_DIR="$APPDIR/Generated"

          VAULT="$GENERATED_DIR/patchvault.bin"
          RESOURCE_VAULT="$GENERATED_DIR/resourcevault.bin"

          PATCH_BRIDGE="$APPDIR/helpers/PatchVaultBridge.generated.c"
          VAULT_GENERATOR="$ROOT/tools/build_patch_vault.py"

          {
            echo "PROJECT=$PROJECT"
            echo "ROOT=$ROOT"
            echo "APPDIR=$APPDIR"

            echo "AUTHSRC=$AUTHSRC"
            echo "AUTHICON=$AUTHICON"
            echo "AUTH=$AUTH"

            echo "AUTH_INTEGRITY=$AUTH_INTEGRITY"
            echo "AUTH_GENERATOR=$AUTH_GENERATOR"

            echo "PATCHES_DIR=$PATCHES_DIR"
            echo "GENERATED_DIR=$GENERATED_DIR"

            echo "VAULT=$VAULT"
            echo "RESOURCE_VAULT=$RESOURCE_VAULT"

            echo "PATCH_BRIDGE=$PATCH_BRIDGE"
            echo "VAULT_GENERATOR=$VAULT_GENERATOR"
          } >> "$GITHUB_ENV"

          mkdir -p "$APPDIR/Auth"
          mkdir -p "$PATCHES_DIR"
          mkdir -p "$GENERATED_DIR"

          test -f "$AUTHSRC" || {
            echo 'ERRO: AuthSource/RemoteAuth.mm ausente.'
            exit 1
          }

          test -s "$AUTHICON" || {
            echo 'ERRO: AuthSource/icon.gif ausente.'
            exit 1
          }

          test -f "$AUTH_GENERATOR" || {
            echo 'ERRO: generate_auth_integrity.py ausente.'
            exit 1
          }

          test -s "$RESOURCE_VAULT" || {
            echo 'ERRO: resourcevault.bin ausente.'
            exit 1
          }

          echo
          echo "========================================"
          echo "SOURCE OK"
          echo "========================================"
          echo "PROJECT: $PROJECT"
          echo "AUTH SOURCE: $AUTHSRC"
          echo "AUTH OUTPUT: $AUTH"

      - name: Compile RemoteAuth dylib
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPILANDO REMOTEAUTH"
          echo "========================================"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          rm -f "$AUTH"

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fvisibility=hidden \
            -O2 \
            -dynamiclib \
            "$AUTHSRC" \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -framework QuartzCore \
            -framework ImageIO \
            -framework CoreGraphics \
            -Wl,-install_name,@rpath/RemoteAuth.dylib \
            -Wl,-dead_strip \
            -Wl,-sectcreate,__DATA,__eaicon,"$AUTHICON" \
            -o "$AUTH"

          #
          # IMPORTANTE:
          # O fingerprint será calculado DEPOIS deste strip.
          # Assim o Swift recebe exatamente o hash da dylib que será embutida.
          #
          strip -S -x "$AUTH" || true

          codesign --remove-signature "$AUTH" 2>/dev/null || true

          test -s "$AUTH" || {
            echo 'ERRO: RemoteAuth.dylib não foi criada.'
            exit 1
          }

          echo
          echo "DYLIB:"
          file "$AUTH"

          echo
          echo "ARQUITETURA:"
          lipo -info "$AUTH" || true

          echo
          echo "DEPENDÊNCIAS:"
          otool -L "$AUTH"

          echo
          echo "VALIDANDO GIF:"

          otool -l "$AUTH" \
            | grep -q 'sectname __eaicon' || {
                echo 'ERRO: GIF não foi embutido em __DATA,__eaicon.'
                exit 1
              }

          strings "$AUTH" \
            | grep -Fq 'RemoteAuthManager' || {
                echo 'ERRO: RemoteAuthManager ausente.'
                exit 1
              }

          echo
          echo "SHA256 COMPLETO:"
          shasum -a 256 "$AUTH"

      - name: Generate RemoteAuth integrity
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GERANDO FINGERPRINT DA DYLIB NOVA"
          echo "========================================"

          #
          # ESTE PASSO É ESSENCIAL.
          #
          # A versão anterior recompilava RemoteAuth.dylib,
          # mas podia deixar AuthIntegrity.generated.swift
          # contendo o fingerprint da build anterior.
          #

          python3 "$AUTH_GENERATOR" \
            --dylib "$AUTH" \
            --swift "$AUTH_INTEGRITY"

          test -s "$AUTH_INTEGRITY" || {
            echo 'ERRO: AuthIntegrity.generated.swift não foi criado.'
            exit 1
          }

          echo
          echo "AUTH INTEGRITY GERADO:"
          cat "$AUTH_INTEGRITY"

      - name: Prepare encrypted patch vault
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARANDO PATCH VAULT"
          echo "========================================"

          #
          # Corrige extensão duplicada, caso exista.
          #
          find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105.3105' \
            | while IFS= read -r FILE; do

                NEW="${FILE%.3105}"

                echo "$FILE"
                echo "->"
                echo "$NEW"

                mv "$FILE" "$NEW"
              done

          #
          # Caso remote.3105 esteja fora do ZIP,
          # procura no repositório.
          #
          if [ ! -f "$PATCHES_DIR/remote.3105" ]; then

            REPO_PATCH="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'remote.3105' \
              ! -path "$PATCHES_DIR/*" \
              ! -path '*/__MACOSX/*' \
              -print -quit || true)"

            if [ -n "$REPO_PATCH" ]; then

              echo "remote.3105 encontrado:"
              echo "$REPO_PATCH"

              cp "$REPO_PATCH" \
                "$PATCHES_DIR/remote.3105"

            fi
          fi

          RAW_COUNT="$(find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            | wc -l \
            | tr -d ' ')"

          echo
          echo ".3105 encontrados: $RAW_COUNT"

          if [ "$RAW_COUNT" -gt 0 ]; then

            if [ "$RAW_COUNT" -ne 1 ] || \
               [ ! -f "$PATCHES_DIR/remote.3105" ]; then

              echo 'ERRO: REMOTE exige somente Patches/remote.3105.'

              find "$PATCHES_DIR" \
                -maxdepth 1 \
                -type f \
                -name '*.3105' \
                -print

              exit 1
            fi

            test -f "$VAULT_GENERATOR" || {
              echo 'ERRO: build_patch_vault.py ausente.'
              exit 1
            }

            VENV="$RUNNER_TEMP/patchvault-venv"

            rm -rf "$VENV"

            python3 -m venv "$VENV"

            "$VENV/bin/python" \
              -m pip install \
              --quiet \
              --upgrade pip cryptography

            "$VENV/bin/python" \
              "$VAULT_GENERATOR" \
              --input "$PATCHES_DIR" \
              --vault "$VAULT" \
              --bridge "$PATCH_BRIDGE"

            test -s "$VAULT" || {
              echo 'ERRO: patchvault.bin não gerado.'
              exit 1
            }

            test -s "$PATCH_BRIDGE" || {
              echo 'ERRO: PatchVaultBridge.generated.c não gerado.'
              exit 1
            }

            #
            # Nenhum .3105 cru entra no app.
            #
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -delete

          else

            echo "Nenhum remote.3105 cru encontrado."

            test -s "$VAULT" || {
              echo 'ERRO: patchvault.bin não existe e remote.3105 não foi encontrado.'
              exit 1
            }

            test -s "$PATCH_BRIDGE" || {
              echo 'ERRO: PatchVaultBridge.generated.c ausente.'
              exit 1
            }

          fi

          RAW_LEFT="$(find "$APPDIR" \
            -type f \
            -name '*.3105' \
            | wc -l \
            | tr -d ' ')"

          test "$RAW_LEFT" -eq 0 || {
            echo 'ERRO: .3105 cru restante.'
            exit 1
          }

          echo
          echo "PATCH VAULT OK"

      - name: Build unsigned Injetor app
        shell: bash
        run: |
          set -uo pipefail

          echo "========================================"
          echo "BUILD INJETOR"
          echo "========================================"

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build 2>&1 \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD FALHOU"
            echo "========================================"

            grep -n -E \
              'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld ' \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -n 400 || true

            exit "$RC"
          fi

      - name: Validate RemoteAuth integration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO APP"
          echo "========================================"

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          if [ -z "$APP" ]; then

            APP="$(find "$GITHUB_WORKSPACE/build" \
              -type d \
              -name '*.app' \
              -print -quit)"

          fi

          test -n "$APP" || {
            echo 'ERRO: .app não encontrado.'
            exit 1
          }

          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$APP/Info.plist")"

          EXE="$APP/$EXECUTABLE_NAME"

          EMBEDDED_AUTH="$APP/Frameworks/RemoteAuth.dylib"

          test -s "$EXE" || {
            echo 'ERRO: executável ausente.'
            exit 1
          }

          test -s "$EMBEDDED_AUTH" || {
            echo 'ERRO: RemoteAuth.dylib não embutida.'
            find "$APP" -maxdepth 4 -type f -print
            exit 1
          }

          echo
          echo "EXECUTÁVEL:"
          echo "$EXE"

          echo
          echo "DYLIB:"
          echo "$EMBEDDED_AUTH"

          #
          # RemoteAuth deve ser dependência real do executável.
          #
          otool -L "$EXE" \
            | grep -Fq '@rpath/RemoteAuth.dylib' || {

                echo 'ERRO: executável não possui LC_LOAD_DYLIB para RemoteAuth.'

                otool -L "$EXE"

                exit 1
              }

          echo
          echo "LC_LOAD_DYLIB RemoteAuth: OK"

          #
          # Vaults.
          #
          otool -l "$EXE" \
            | grep -q 'sectname __pv3105' || {
                echo 'ERRO: __pv3105 ausente.'
                exit 1
              }

          otool -l "$EXE" \
            | grep -q 'sectname __rv3105' || {
                echo 'ERRO: __rv3105 ausente.'
                exit 1
              }

          echo "__pv3105: OK"
          echo "__rv3105: OK"

          #
          # Confirma que o bridge da auth está presente.
          #
          strings "$EXE" \
            | grep -Fq 'RemoteAuthManager' || {
                echo 'ERRO: bridge RemoteAuthManager não está no executável.'
                exit 1
              }

          #
          # Confirma nome.
          #
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleDisplayName' \
            "$APP/Info.plist")"

          test "$DISPLAY_NAME" = 'Injetor' || {
            echo "ERRO: nome final é $DISPLAY_NAME"
            exit 1
          }

          #
          # Confirma Assets.
          #
          test -s "$APP/Assets.car" || {
            echo 'ERRO: Assets.car/app icon ausente.'
            exit 1
          }

          echo
          echo "========================================"
          echo "VALIDANDO FINGERPRINT EMBUTIDO"
          echo "========================================"

          #
          # Recalcula o fingerprint EXATAMENTE da dylib
          # que acabou dentro do .app.
          #
          TMP_SWIFT="$RUNNER_TEMP/embedded-auth.swift"

          python3 "$AUTH_GENERATOR" \
            --dylib "$EMBEDDED_AUTH" \
            --swift "$TMP_SWIFT"

          EXPECTED="$(grep 'expectedSHA256' "$AUTH_INTEGRITY" \
            | sed -E 's/.*"([0-9a-f]+)".*/\1/')"

          ACTUAL="$(grep 'expectedSHA256' "$TMP_SWIFT" \
            | sed -E 's/.*"([0-9a-f]+)".*/\1/')"

          echo "EXPECTED: $EXPECTED"
          echo "ACTUAL:   $ACTUAL"

          test -n "$EXPECTED" || {
            echo 'ERRO: fingerprint esperado vazio.'
            exit 1
          }

          test -n "$ACTUAL" || {
            echo 'ERRO: fingerprint real vazio.'
            exit 1
          }

          test "$EXPECTED" = "$ACTUAL" || {
            echo 'ERRO: dylib embutida não corresponde ao fingerprint compilado.'
            exit 1
          }

          echo
          echo "FINGERPRINT: OK"

          #
          # Limpeza final.
          #
          strip -S -x "$EXE" || true

          rm -rf "$APP/Patches"
          rm -f "$APP/PkgInfo"

          RAW_APP="$(find "$APP" \
            -type f \
            -name '*.3105' \
            | wc -l \
            | tr -d ' ')"

          test "$RAW_APP" -eq 0 || {
            echo 'ERRO: .3105 cru encontrado no app.'
            exit 1
          }

          echo
          echo "APP VALIDADO"

          #
          # Exporta APP para próximo step.
          #
          echo "FINAL_APP=$APP" >> "$GITHUB_ENV"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PACKAGE IPA"
          echo "========================================"

          test -d "$FINAL_APP" || {
            echo 'ERRO: FINAL_APP não existe.'
            exit 1
          }

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$FINAL_APP" \
            Payload/3105.app

          IPA='Injetor-REMOTE-1.0.1-HARDENED-unsigned.ipa'

          rm -f "$IPA"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA"

          test -s "$IPA" || {
            echo 'ERRO: IPA não criada.'
            exit 1
          }

          unzip -l "$IPA" \
            | grep -Fq \
              'Payload/3105.app/Frameworks/RemoteAuth.dylib' || {

                echo 'ERRO: RemoteAuth.dylib ausente da IPA final.'
                exit 1
              }

          echo
          echo "========================================"
          echo "INJETOR REMOTE BLACKSCREEN FIX OK"
          echo "========================================"

          ls -lh "$IPA"

          echo
          echo "IPA SHA256:"
          shasum -a 256 "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Injetor-REMOTE-HARDENED-unsigned
          path: Injetor-REMOTE-1.0.1-HARDENED-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-injetor-remote-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
