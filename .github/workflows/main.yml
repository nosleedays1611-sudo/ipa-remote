name: Build Injetor REMOTE Hardened IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and prepare source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf source build Payload
          mkdir -p source

          SOURCE_ZIP=""

          while IFS= read -r ZIP; do
            if unzip -Z1 "$ZIP" 2>/dev/null \
              | grep -qE '(^|/)ThreeOneOSFive\.xcodeproj/project\.pbxproj$'; then
              SOURCE_ZIP="$ZIP"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" -maxdepth 3 \
              -type f -name '*.zip' -print
          )

          if [ -n "$SOURCE_ZIP" ]; then
            echo "Source ZIP: $SOURCE_ZIP"

            unzip -q "$SOURCE_ZIP" \
              -d "$GITHUB_WORKSPACE/source" \
              -x '__MACOSX/*' '*/__MACOSX/*'

            find "$GITHUB_WORKSPACE/source" \
              -type f -name '._*' -delete || true

            SEARCH_ROOT="$GITHUB_WORKSPACE/source"
          else
            echo "Projeto ja extraido no repositorio."
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          PROJECT="$(find "$SEARCH_ROOT" \
            -type d \
            -name 'ThreeOneOSFive.xcodeproj' \
            ! -path '*/__MACOSX/*' \
            ! -path '*/build/*' \
            -print -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERRO: ThreeOneOSFive.xcodeproj nao encontrado."
            exit 1
          fi

          ROOT="$(dirname "$PROJECT")"
          APPDIR="$ROOT/ThreeOneOSFive"

          AUTH_SOURCE="$APPDIR/Auth/RemoteAuth.mm"
          AUTH_GIF="$APPDIR/Auth/icon.gif"
          AUTH="$APPDIR/Auth/RemoteAuth.dylib"

          PATCHES_DIR="$APPDIR/Patches"
          GENERATED_DIR="$APPDIR/Generated"

          VAULT="$GENERATED_DIR/patchvault.bin"
          RESOURCE_VAULT="$GENERATED_DIR/resourcevault.bin"

          PATCH_BRIDGE="$APPDIR/helpers/PatchVaultBridge.generated.c"
          VAULT_GENERATOR="$ROOT/tools/build_patch_vault.py"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"

          echo "AUTH_SOURCE=$AUTH_SOURCE" >> "$GITHUB_ENV"
          echo "AUTH_GIF=$AUTH_GIF" >> "$GITHUB_ENV"
          echo "AUTH=$AUTH" >> "$GITHUB_ENV"

          echo "PATCHES_DIR=$PATCHES_DIR" >> "$GITHUB_ENV"
          echo "GENERATED_DIR=$GENERATED_DIR" >> "$GITHUB_ENV"

          echo "VAULT=$VAULT" >> "$GITHUB_ENV"
          echo "RESOURCE_VAULT=$RESOURCE_VAULT" >> "$GITHUB_ENV"
          echo "PATCH_BRIDGE=$PATCH_BRIDGE" >> "$GITHUB_ENV"
          echo "VAULT_GENERATOR=$VAULT_GENERATOR" >> "$GITHUB_ENV"

          mkdir -p "$PATCHES_DIR"
          mkdir -p "$GENERATED_DIR"
          mkdir -p "$APPDIR/Auth"

          echo "========================================"
          echo "SOURCE"
          echo "========================================"

          echo "PROJECT: $PROJECT"
          echo "ROOT:    $ROOT"

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          xcodebuild -showsdks

      - name: Build RemoteAuth dylib
        shell: bash
        run: |
          set -euo pipefail

          test -s "$AUTH_SOURCE" || {
            echo "ERRO: RemoteAuth.mm nao encontrada."
            exit 1
          }

          test -s "$AUTH_GIF" || {
            echo "ERRO: Auth/icon.gif nao encontrado."
            exit 1
          }

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "========================================"
          echo "BUILD REMOTE AUTH"
          echo "========================================"

          echo "SDK: $SDK_PATH"

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fvisibility=hidden \
            -O2 \
            -dynamiclib \
            "$AUTH_SOURCE" \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -framework QuartzCore \
            -framework ImageIO \
            -framework CoreGraphics \
            -Wl,-install_name,@rpath/RemoteAuth.dylib \
            -Wl,-dead_strip \
            -Wl,-sectcreate,__DATA,__eaicon,"$AUTH_GIF" \
            -o "$AUTH"

          test -s "$AUTH" || {
            echo "ERRO: RemoteAuth.dylib nao foi criada."
            exit 1
          }

          echo
          echo "RemoteAuth:"
          file "$AUTH"

          echo
          echo "Arquitetura:"
          lipo -info "$AUTH" || true

          echo
          echo "Dependencias:"
          otool -L "$AUTH"

          echo
          echo "GIF embutido:"
          otool -l "$AUTH" | grep -A6 "__eaicon"

          echo
          echo "SHA256:"
          shasum -a 256 "$AUTH"

      - name: Prepare patch vault
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PATCH VAULT"
          echo "========================================"

          test -s "$RESOURCE_VAULT" || {
            echo "ERRO: resourcevault.bin ausente."
            exit 1
          }

          if [ ! -f "$PATCHES_DIR/remote.3105" ]; then

            REPO_PATCH="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'remote.3105' \
              ! -path "$PATCHES_DIR/*" \
              -print -quit || true)"

            if [ -n "$REPO_PATCH" ]; then
              echo "remote.3105 encontrado:"
              echo "$REPO_PATCH"

              cp "$REPO_PATCH" \
                "$PATCHES_DIR/remote.3105"
            fi
          fi

          RAW_COUNT="$(find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            | wc -l \
            | tr -d ' ')"

          echo "Arquivos .3105: $RAW_COUNT"

          if [ "$RAW_COUNT" -gt 0 ]; then

            if [ "$RAW_COUNT" -ne 1 ]; then
              echo "ERRO: REMOTE exige exatamente um .3105."
              find "$PATCHES_DIR" \
                -maxdepth 1 \
                -type f \
                -name '*.3105' \
                -print
              exit 1
            fi

            test -f "$PATCHES_DIR/remote.3105" || {
              echo "ERRO: o arquivo precisa se chamar remote.3105"
              exit 1
            }

            test -f "$VAULT_GENERATOR" || {
              echo "ERRO: build_patch_vault.py ausente."
              exit 1
            }

            VENV="$RUNNER_TEMP/patchvault-venv"

            rm -rf "$VENV"

            python3 -m venv "$VENV"

            "$VENV/bin/python" \
              -m pip install \
              --quiet \
              --upgrade pip cryptography

            "$VENV/bin/python" \
              "$VAULT_GENERATOR" \
              --input "$PATCHES_DIR" \
              --vault "$VAULT" \
              --bridge "$PATCH_BRIDGE"

            test -s "$VAULT" || {
              echo "ERRO: patchvault.bin nao gerado."
              exit 1
            }

            test -s "$PATCH_BRIDGE" || {
              echo "ERRO: PatchVaultBridge.generated.c nao gerado."
              exit 1
            }

            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -delete

          else

            test -s "$VAULT" || {
              echo "ERRO: patchvault.bin nao existe e remote.3105 nao foi encontrado."
              exit 1
            }

            test -s "$PATCH_BRIDGE" || {
              echo "ERRO: PatchVaultBridge.generated.c ausente."
              exit 1
            }
          fi

          echo
          echo "Patch vault:"
          ls -lh "$VAULT"

          echo
          echo "Resource vault:"
          ls -lh "$RESOURCE_VAULT"

      - name: Build unsigned Injetor
        shell: bash
        run: |
          set -uo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build 2>&1 \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then

            echo "========================================"
            echo "BUILD FALHOU"
            echo "========================================"

            grep -n -E \
              'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld ' \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -n 300 || true

            exit "$RC"
          fi

      - name: Validate Injetor
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          test -n "$APP" || {
            echo "ERRO: 3105.app nao encontrado."
            exit 1
          }

          EXE="$APP/3105"

          EMBEDDED_AUTH="$APP/Frameworks/RemoteAuth.dylib"

          test -s "$EXE" || {
            echo "ERRO: executavel principal ausente."
            exit 1
          }

          test -s "$EMBEDDED_AUTH" || {
            echo "ERRO: RemoteAuth.dylib nao foi embutida."
            exit 1
          }

          echo "========================================"
          echo "REMOTE AUTH"
          echo "========================================"

          if ! otool -L "$EXE" \
            | grep -Fq '@rpath/RemoteAuth.dylib'; then

            echo "ERRO: executavel nao depende da RemoteAuth."
            otool -L "$EXE"
            exit 1
          fi

          echo "RemoteAuth LC_LOAD_DYLIB: OK"

          echo
          echo "========================================"
          echo "VAULTS"
          echo "========================================"

          otool -l "$EXE" \
            | grep -q 'sectname __pv3105' || {
              echo "ERRO: __pv3105 ausente."
              exit 1
            }

          otool -l "$EXE" \
            | grep -q 'sectname __rv3105' || {
              echo "ERRO: __rv3105 ausente."
              exit 1
            }

          echo "__pv3105: OK"
          echo "__rv3105: OK"

          RAW_APP="$(find "$APP" \
            -type f \
            -name '*.3105' \
            | wc -l \
            | tr -d ' ')"

          if [ "$RAW_APP" -ne 0 ]; then
            echo "ERRO: .3105 cru encontrado dentro do app."
            find "$APP" -type f -name '*.3105' -print
            exit 1
          fi

          echo
          echo "Executavel:"
          file "$EXE"

          echo
          echo "Dependencias:"
          otool -L "$EXE"

          echo
          echo "RemoteAuth:"
          file "$EMBEDDED_AUTH"

          echo
          echo "SHA256 RemoteAuth:"
          shasum -a 256 "$EMBEDDED_AUTH"

      - name: Strip release symbols
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          EXE="$APP/3105"

          strip -S -x "$EXE" || true

          rm -rf "$APP/Patches"
          rm -f "$APP/PkgInfo"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" \
            "Payload/Injetor.app"

          IPA="Injetor-REMOTE-1.0.1-unsigned.ipa"

          rm -f "$IPA"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA"

          test -s "$IPA" || {
            echo "ERRO: IPA nao criada."
            exit 1
          }

          echo "========================================"
          echo "VALIDANDO IPA FINAL"
          echo "========================================"

          unzip -l "$IPA" \
            | grep -F \
              'Payload/Injetor.app/Frameworks/RemoteAuth.dylib'

          echo
          echo "IPA:"
          ls -lh "$IPA"

          echo
          echo "SHA256:"
          shasum -a 256 "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Injetor-REMOTE-unsigned
          path: Injetor-REMOTE-1.0.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-injetor-remote-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
