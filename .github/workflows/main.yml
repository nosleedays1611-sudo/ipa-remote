name: Build Injetor REMOTE Hardened IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf source build Payload
          mkdir -p source

          SOURCE_ZIP=""

          while IFS= read -r ZIP; do
            if unzip -Z1 "$ZIP" 2>/dev/null \
              | grep -qE '(^|/)ThreeOneOSFive\.xcodeproj/project\.pbxproj$'; then
              SOURCE_ZIP="$ZIP"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              -print
          )

          if [ -n "$SOURCE_ZIP" ]; then
            echo "========================================"
            echo "SOURCE ZIP"
            echo "========================================"
            echo "$SOURCE_ZIP"

            unzip -q "$SOURCE_ZIP" \
              -d "$GITHUB_WORKSPACE/source" \
              -x '__MACOSX/*' '*/__MACOSX/*'

            find "$GITHUB_WORKSPACE/source" \
              -type f \
              -name '._*' \
              -delete || true

            SEARCH_ROOT="$GITHUB_WORKSPACE/source"
          else
            echo "Projeto já extraído no repositório."
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          PROJECT="$(find "$SEARCH_ROOT" \
            -type d \
            -name 'ThreeOneOSFive.xcodeproj' \
            ! -path '*/__MACOSX/*' \
            ! -path '*/build/*' \
            -print -quit)"

          test -n "$PROJECT" || {
            echo 'ERRO: ThreeOneOSFive.xcodeproj não encontrado.'
            exit 1
          }

          ROOT="$(dirname "$PROJECT")"
          APPDIR="$ROOT/ThreeOneOSFive"

          AUTHSRC="$ROOT/AuthSource/RemoteAuth.mm"
          AUTHICON="$ROOT/AuthSource/icon.gif"

          AUTH="$APPDIR/Auth/RemoteAuth.dylib"

          AUTH_INTEGRITY="$APPDIR/helpers/AuthIntegrity.generated.swift"
          AUTH_GENERATOR="$ROOT/tools/generate_auth_integrity.py"

          PATCHES_DIR="$APPDIR/Patches"
          GENERATED_DIR="$APPDIR/Generated"

          VAULT="$GENERATED_DIR/patchvault.bin"
          RESOURCE_VAULT="$GENERATED_DIR/resourcevault.bin"

          PATCH_BRIDGE="$APPDIR/helpers/PatchVaultBridge.generated.c"
          VAULT_GENERATOR="$ROOT/tools/build_patch_vault.py"

          {
            echo "PROJECT=$PROJECT"
            echo "ROOT=$ROOT"
            echo "APPDIR=$APPDIR"

            echo "AUTHSRC=$AUTHSRC"
            echo "AUTHICON=$AUTHICON"
            echo "AUTH=$AUTH"

            echo "AUTH_INTEGRITY=$AUTH_INTEGRITY"
            echo "AUTH_GENERATOR=$AUTH_GENERATOR"

            echo "PATCHES_DIR=$PATCHES_DIR"
            echo "GENERATED_DIR=$GENERATED_DIR"

            echo "VAULT=$VAULT"
            echo "RESOURCE_VAULT=$RESOURCE_VAULT"

            echo "PATCH_BRIDGE=$PATCH_BRIDGE"
            echo "VAULT_GENERATOR=$VAULT_GENERATOR"
          } >> "$GITHUB_ENV"

          mkdir -p "$APPDIR/Auth"
          mkdir -p "$PATCHES_DIR"
          mkdir -p "$GENERATED_DIR"

          test -s "$AUTHSRC" || {
            echo 'ERRO: AuthSource/RemoteAuth.mm ausente.'
            exit 1
          }

          test -s "$AUTHICON" || {
            echo 'ERRO: AuthSource/icon.gif ausente.'
            exit 1
          }

          test -f "$AUTH_GENERATOR" || {
            echo 'ERRO: generate_auth_integrity.py ausente.'
            exit 1
          }

          test -s "$RESOURCE_VAULT" || {
            echo 'ERRO: resourcevault.bin ausente.'
            exit 1
          }

          echo
          echo "========================================"
          echo "SOURCE OK"
          echo "========================================"

          echo "PROJECT: $PROJECT"
          echo "ROOT: $ROOT"
          echo "APPDIR: $APPDIR"
          echo "AUTH SOURCE: $AUTHSRC"
          echo "AUTH OUTPUT: $AUTH"

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version

          echo
          echo "SDK:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile RemoteAuth dylib
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "COMPILANDO REMOTEAUTH"
          echo "========================================"

          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"

          mkdir -p "$(dirname "$AUTH")"

          rm -f "$AUTH"

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fvisibility=hidden \
            -O2 \
            -dynamiclib \
            "$AUTHSRC" \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -framework QuartzCore \
            -framework ImageIO \
            -framework CoreGraphics \
            -Wl,-install_name,@rpath/RemoteAuth.dylib \
            -Wl,-dead_strip \
            -Wl,-sectcreate,__DATA,__eaicon,"$AUTHICON" \
            -o "$AUTH"

          test -s "$AUTH" || {
            echo 'ERRO: RemoteAuth.dylib não foi criada.'
            exit 1
          }

          #
          # O fingerprint será calculado sobre a versão
          # final da dylib depois do strip.
          #
          strip -S -x "$AUTH" || true

          codesign --remove-signature "$AUTH" 2>/dev/null || true

          echo
          echo "========================================"
          echo "DYLIB GERADA"
          echo "========================================"

          ls -lh "$AUTH"

          echo
          file "$AUTH"

          echo
          echo "Arquitetura:"
          lipo -info "$AUTH" || true

          echo
          echo "Dependências:"
          otool -L "$AUTH"

          #
          # NÃO usamos:
          #
          # strings | grep -q
          #
          # porque set -o pipefail pode interpretar o SIGPIPE
          # do strings como falha.
          #

          AUTH_OTOOL="$RUNNER_TEMP/remoteauth-otool.txt"
          AUTH_STRINGS="$RUNNER_TEMP/remoteauth-strings.txt"

          otool -l "$AUTH" > "$AUTH_OTOOL"
          strings "$AUTH" > "$AUTH_STRINGS"

          echo
          echo "VALIDANDO GIF:"

          if ! grep -q 'sectname __eaicon' "$AUTH_OTOOL"; then
            echo 'ERRO: GIF não foi embutido em __DATA,__eaicon.'
            exit 1
          fi

          echo "__eaicon: OK"

          echo
          echo "VALIDANDO REMOTEAUTHMANAGER:"

          if ! grep -Fq 'RemoteAuthManager' "$AUTH_STRINGS"; then
            echo 'ERRO: RemoteAuthManager ausente.'
            exit 1
          fi

          echo "RemoteAuthManager: OK"

          echo
          echo "SHA256:"
          shasum -a 256 "$AUTH"

      - name: Generate RemoteAuth integrity
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GERANDO FINGERPRINT REMOTEAUTH"
          echo "========================================"

          test -s "$AUTH" || {
            echo 'ERRO: RemoteAuth.dylib ausente.'
            exit 1
          }

          test -f "$AUTH_GENERATOR" || {
            echo 'ERRO: generate_auth_integrity.py ausente.'
            exit 1
          }

          #
          # IMPORTANTE:
          #
          # O fingerprint é gerado DEPOIS da dylib final
          # e ANTES do xcodebuild.
          #
          python3 "$AUTH_GENERATOR" \
            --dylib "$AUTH" \
            --swift "$AUTH_INTEGRITY"

          test -s "$AUTH_INTEGRITY" || {
            echo 'ERRO: AuthIntegrity.generated.swift não foi criado.'
            exit 1
          }

          echo
          echo "AuthIntegrity.generated.swift:"
          cat "$AUTH_INTEGRITY"

      - name: Prepare encrypted patch vault
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PATCH VAULT"
          echo "========================================"

          test -s "$RESOURCE_VAULT" || {
            echo "ERRO: resourcevault.bin ausente:"
            echo "$RESOURCE_VAULT"
            exit 1
          }

          #
          # Corrigir extensão duplicada.
          #
          while IFS= read -r FILE; do

            [ -n "$FILE" ] || continue

            NEW="${FILE%.3105}"

            echo "Renomeando:"
            echo "$FILE"
            echo "->"
            echo "$NEW"

            mv "$FILE" "$NEW"

          done < <(
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105.3105' \
              -print
          )

          #
          # Procurar remote.3105 no repositório caso
          # não esteja dentro da source.
          #
          if [ ! -f "$PATCHES_DIR/remote.3105" ]; then

            REPO_PATCH="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'remote.3105' \
              ! -path "$PATCHES_DIR/*" \
              ! -path '*/__MACOSX/*' \
              -print -quit || true)"

            if [ -n "$REPO_PATCH" ]; then

              echo
              echo "remote.3105 encontrado:"
              echo "$REPO_PATCH"

              cp "$REPO_PATCH" \
                "$PATCHES_DIR/remote.3105"

            fi
          fi

          RAW_COUNT="$(find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            | wc -l \
            | tr -d ' ')"

          echo
          echo ".3105 encontrados: $RAW_COUNT"

          if [ "$RAW_COUNT" -gt 0 ]; then

            if [ "$RAW_COUNT" -ne 1 ]; then

              echo 'ERRO: REMOTE deve possuir exatamente um .3105.'

              find "$PATCHES_DIR" \
                -maxdepth 1 \
                -type f \
                -name '*.3105' \
                -print

              exit 1
            fi

            test -s "$PATCHES_DIR/remote.3105" || {
              echo 'ERRO: Patches/remote.3105 ausente.'
              exit 1
            }

            test -s "$VAULT_GENERATOR" || {
              echo "ERRO: build_patch_vault.py ausente:"
              echo "$VAULT_GENERATOR"
              exit 1
            }

            VENV="$RUNNER_TEMP/patchvault-venv"

            rm -rf "$VENV"

            python3 -m venv "$VENV"

            "$VENV/bin/python" \
              -m pip install \
              --quiet \
              --upgrade pip cryptography

            "$VENV/bin/python" \
              "$VAULT_GENERATOR" \
              --input "$PATCHES_DIR" \
              --vault "$VAULT" \
              --bridge "$PATCH_BRIDGE"

            test -s "$VAULT" || {
              echo 'ERRO: patchvault.bin não foi gerado.'
              exit 1
            }

            test -s "$PATCH_BRIDGE" || {
              echo 'ERRO: PatchVaultBridge.generated.c não foi gerado.'
              exit 1
            }

            #
            # Não deixar .3105 cru no app.
            #
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              -delete

          else

            echo "Nenhum .3105 cru encontrado."

            test -s "$VAULT" || {
              echo 'ERRO: patchvault.bin também não existe.'
              exit 1
            }

            test -s "$PATCH_BRIDGE" || {
              echo 'ERRO: PatchVaultBridge.generated.c ausente.'
              exit 1
            }

          fi

          echo
          echo "Patch vault:"
          ls -lh "$VAULT"

          echo
          echo "Resource vault:"
          ls -lh "$RESOURCE_VAULT"

      - name: Build unsigned Injetor app
        shell: bash
        run: |
          set -uo pipefail

          echo "========================================"
          echo "BUILD INJETOR"
          echo "========================================"

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build 2>&1 \
            | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then

            echo
            echo "========================================"
            echo "XCODEBUILD FALHOU"
            echo "========================================"

            grep -n -E \
              'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld ' \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -n 400 || true

            exit "$RC"
          fi

      - name: Validate RemoteAuth integration
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO APP"
          echo "========================================"

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print -quit)"

          if [ -z "$APP" ]; then

            APP="$(find "$GITHUB_WORKSPACE/build" \
              -type d \
              -name '*.app' \
              -print -quit)"

          fi

          test -n "$APP" || {
            echo 'ERRO: .app não encontrado.'
            exit 1
          }

          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$APP/Info.plist")"

          EXE="$APP/$EXECUTABLE_NAME"

          EMBEDDED_AUTH="$APP/Frameworks/RemoteAuth.dylib"

          echo
          echo "APP:"
          echo "$APP"

          echo
          echo "EXECUTÁVEL:"
          echo "$EXE"

          test -s "$EXE" || {
            echo 'ERRO: executável principal ausente.'
            exit 1
          }

          test -s "$EMBEDDED_AUTH" || {

            echo 'ERRO: RemoteAuth.dylib não foi embutida em Frameworks.'

            echo
            echo "Arquivos do app:"

            find "$APP" \
              -maxdepth 4 \
              -type f \
              -print

            exit 1
          }

          echo
          echo "========================================"
          echo "LC_LOAD_DYLIB"
          echo "========================================"

          EXE_OTOOL_L="$RUNNER_TEMP/exe-otool-L.txt"

          otool -L "$EXE" > "$EXE_OTOOL_L"

          if ! grep -Fq \
            '@rpath/RemoteAuth.dylib' \
            "$EXE_OTOOL_L"; then

            echo 'ERRO: executável não possui LC_LOAD_DYLIB para RemoteAuth.'

            echo
            cat "$EXE_OTOOL_L"

            exit 1
          fi

          echo "RemoteAuth LC_LOAD_DYLIB: OK"

          echo
          echo "========================================"
          echo "VAULTS"
          echo "========================================"

          EXE_OTOOL="$RUNNER_TEMP/exe-otool.txt"

          otool -l "$EXE" > "$EXE_OTOOL"

          if ! grep -q \
            'sectname __pv3105' \
            "$EXE_OTOOL"; then

            echo 'ERRO: seção __pv3105 ausente.'
            exit 1
          fi

          if ! grep -q \
            'sectname __rv3105' \
            "$EXE_OTOOL"; then

            echo 'ERRO: seção __rv3105 ausente.'
            exit 1
          fi

          echo "__pv3105: OK"
          echo "__rv3105: OK"

          echo
          echo "========================================"
          echo "REMOTEAUTH BRIDGE"
          echo "========================================"

          EXE_STRINGS="$RUNNER_TEMP/exe-strings.txt"

          strings "$EXE" > "$EXE_STRINGS"

          if ! grep -Fq \
            'RemoteAuthManager' \
            "$EXE_STRINGS"; then

            echo 'ERRO: bridge RemoteAuthManager não está no executável.'
            exit 1
          fi

          echo "RemoteAuthManager bridge: OK"

          echo
          echo "========================================"
          echo "APP NAME"
          echo "========================================"

          DISPLAY_NAME="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleDisplayName' \
            "$APP/Info.plist")"

          echo "CFBundleDisplayName: $DISPLAY_NAME"

          test "$DISPLAY_NAME" = 'Injetor' || {
            echo "ERRO: nome final é $DISPLAY_NAME"
            exit 1
          }

          echo
          echo "========================================"
          echo "ASSETS"
          echo "========================================"

          test -s "$APP/Assets.car" || {
            echo 'ERRO: Assets.car ausente.'
            exit 1
          }

          echo "Assets.car: OK"

          echo
          echo "========================================"
          echo "VALIDANDO FINGERPRINT"
          echo "========================================"

          TMP_SWIFT="$RUNNER_TEMP/embedded-auth.swift"

          python3 "$AUTH_GENERATOR" \
            --dylib "$EMBEDDED_AUTH" \
            --swift "$TMP_SWIFT"

          EXPECTED="$(
            grep 'expectedSHA256' "$AUTH_INTEGRITY" \
              | sed -E 's/.*"([0-9a-f]+)".*/\1/'
          )"

          ACTUAL="$(
            grep 'expectedSHA256' "$TMP_SWIFT" \
              | sed -E 's/.*"([0-9a-f]+)".*/\1/'
          )"

          echo
          echo "EXPECTED:"
          echo "$EXPECTED"

          echo
          echo "ACTUAL:"
          echo "$ACTUAL"

          test -n "$EXPECTED" || {
            echo 'ERRO: fingerprint esperado vazio.'
            exit 1
          }

          test -n "$ACTUAL" || {
            echo 'ERRO: fingerprint real vazio.'
            exit 1
          }

          if [ "$EXPECTED" != "$ACTUAL" ]; then

            echo
            echo "========================================"
            echo "ERRO DE INTEGRIDADE"
            echo "========================================"

            echo "A RemoteAuth.dylib dentro do app não corresponde"
            echo "ao fingerprint compilado no executável."

            exit 1
          fi

          echo
          echo "FINGERPRINT: OK"

          echo
          echo "========================================"
          echo "RAW PATCH CHECK"
          echo "========================================"

          RAW_APP="$(
            find "$APP" \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$RAW_APP" -ne 0 ]; then

            echo 'ERRO: arquivo .3105 cru encontrado dentro do app.'

            find "$APP" \
              -type f \
              -name '*.3105' \
              -print

            exit 1
          fi

          echo "Nenhum .3105 cru: OK"

          echo
          echo "========================================"
          echo "STRIP EXECUTÁVEL"
          echo "========================================"

          strip -S -x "$EXE" || true

          rm -rf "$APP/Patches"
          rm -f "$APP/PkgInfo"

          echo
          echo "APP VALIDADO"

          echo "FINAL_APP=$APP" >> "$GITHUB_ENV"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PACKAGE IPA"
          echo "========================================"

          test -d "$FINAL_APP" || {
            echo 'ERRO: FINAL_APP não existe.'
            exit 1
          }

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$FINAL_APP" \
            Payload/3105.app

          IPA="Injetor-REMOTE-1.0.1-HARDENED-unsigned.ipa"

          rm -f "$IPA"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA"

          test -s "$IPA" || {
            echo 'ERRO: IPA não criada.'
            exit 1
          }

          echo
          echo "========================================"
          echo "VALIDANDO IPA FINAL"
          echo "========================================"

          IPA_LIST="$RUNNER_TEMP/ipa-list.txt"

          unzip -l "$IPA" > "$IPA_LIST"

          if ! grep -Fq \
            'Payload/3105.app/Frameworks/RemoteAuth.dylib' \
            "$IPA_LIST"; then

            echo 'ERRO: RemoteAuth.dylib ausente da IPA final.'
            exit 1
          fi

          echo "RemoteAuth.dylib: OK"

          echo
          echo "========================================"
          echo "BUILD FINALIZADA"
          echo "========================================"

          ls -lh "$IPA"

          echo
          echo "SHA256:"
          shasum -a 256 "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Injetor-REMOTE-HARDENED-unsigned
          path: Injetor-REMOTE-1.0.1-HARDENED-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-injetor-remote-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
