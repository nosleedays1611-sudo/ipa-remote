name: Build REMOTE unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract and prepare REMOTE source
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf source build Payload
          mkdir -p source

          echo "========================================"
          echo "PROCURANDO SOURCE REMOTE"
          echo "========================================"

          SOURCE_ZIP=""

          while IFS= read -r ZIP; do
            echo "Verificando: $ZIP"

            if unzip -Z1 "$ZIP" 2>/dev/null \
              | grep -qE '(^|/)ThreeOneOSFive\.xcodeproj/project\.pbxproj$'; then

              SOURCE_ZIP="$ZIP"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              -print
          )

          if [ -n "$SOURCE_ZIP" ]; then
            echo "Source encontrada:"
            echo "$SOURCE_ZIP"

            unzip -q "$SOURCE_ZIP" \
              -d "$GITHUB_WORKSPACE/source" \
              -x "__MACOSX/*" "*/__MACOSX/*"

            find "$GITHUB_WORKSPACE/source" \
              -type d \
              -name '__MACOSX' \
              -prune \
              -exec rm -rf {} + 2>/dev/null || true

            find "$GITHUB_WORKSPACE/source" \
              -type f \
              -name '._*' \
              -delete 2>/dev/null || true

            SEARCH_ROOT="$GITHUB_WORKSPACE/source"
          else
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          PROJECT="$(find "$SEARCH_ROOT" \
            -type d \
            -name 'ThreeOneOSFive.xcodeproj' \
            ! -path '*/__MACOSX/*' \
            ! -path '*/build/*' \
            -print \
            -quit)"

          if [ -z "$PROJECT" ]; then
            echo "ERRO: ThreeOneOSFive.xcodeproj não encontrado."
            exit 1
          fi

          ROOT="$(dirname "$PROJECT")"

          PATCHES_DIR="$ROOT/ThreeOneOSFive/Patches"
          GENERATED_DIR="$ROOT/ThreeOneOSFive/Generated"

          VAULT="$GENERATED_DIR/patchvault.bin"
          RESOURCE_VAULT="$GENERATED_DIR/resourcevault.bin"

          PATCH_BRIDGE="$ROOT/ThreeOneOSFive/helpers/PatchVaultBridge.generated.c"
          VAULT_GENERATOR="$ROOT/tools/build_patch_vault.py"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "PATCHES_DIR=$PATCHES_DIR" >> "$GITHUB_ENV"
          echo "VAULT=$VAULT" >> "$GITHUB_ENV"
          echo "RESOURCE_VAULT=$RESOURCE_VAULT" >> "$GITHUB_ENV"
          echo "PATCH_BRIDGE=$PATCH_BRIDGE" >> "$GITHUB_ENV"

          mkdir -p "$PATCHES_DIR"
          mkdir -p "$GENERATED_DIR"
          mkdir -p "$(dirname "$PATCH_BRIDGE")"

          echo "========================================"
          echo "VALIDANDO BASE"
          echo "========================================"

          if [ ! -s "$RESOURCE_VAULT" ]; then
            echo "ERRO: resourcevault.bin não encontrado."
            exit 1
          fi

          if [ ! -f "$VAULT_GENERATOR" ]; then
            echo "ERRO: build_patch_vault.py não encontrado."
            exit 1
          fi

          echo "========================================"
          echo "NORMALIZANDO NOMES .3105"
          echo "========================================"

          while IFS= read -r -d '' FILE; do
            DEST="${FILE%.3105}"

            if [ -e "$DEST" ]; then
              echo "ERRO: destino já existe:"
              echo "$DEST"
              exit 1
            fi

            mv "$FILE" "$DEST"

          done < <(
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105.3105' \
              -print0
          )

          PATCH_COUNT="$(
            find "$PATCHES_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Quantidade de .3105: $PATCH_COUNT"

          if [ "$PATCH_COUNT" -ne 1 ]; then
            echo "ERRO: REMOTE exige exatamente 1 arquivo .3105."
            echo "Esperado: ThreeOneOSFive/Patches/remote.3105"
            exit 1
          fi

          if [ ! -f "$PATCHES_DIR/remote.3105" ]; then
            echo "ERRO: o arquivo precisa se chamar remote.3105"
            exit 1
          fi

          echo "========================================"
          echo "PREPARANDO PYTHON"
          echo "========================================"

          PYTHON_VENV="$RUNNER_TEMP/patchvault-venv"

          rm -rf "$PYTHON_VENV"

          python3 -m venv "$PYTHON_VENV"

          "$PYTHON_VENV/bin/python" \
            -m pip install \
            --upgrade pip

          "$PYTHON_VENV/bin/python" \
            -m pip install \
            cryptography

          echo "========================================"
          echo "GERANDO PATCH VAULT"
          echo "========================================"

          "$PYTHON_VENV/bin/python" \
            "$VAULT_GENERATOR" \
            --input "$PATCHES_DIR" \
            --vault "$VAULT" \
            --bridge "$PATCH_BRIDGE"

          if [ ! -s "$VAULT" ]; then
            echo "ERRO: patchvault.bin não foi gerado."
            exit 1
          fi

          if [ ! -s "$PATCH_BRIDGE" ]; then
            echo "ERRO: PatchVaultBridge.generated.c não foi gerado."
            exit 1
          fi

          echo "Patch vault:"
          ls -lh "$VAULT"

          echo "Resource vault:"
          ls -lh "$RESOURCE_VAULT"

          echo "========================================"
          echo "REMOVENDO .3105 CRU"
          echo "========================================"

          find "$PATCHES_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.3105' \
            -delete

          RAW_PATCH_COUNT="$(
            find "$ROOT/ThreeOneOSFive" \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$RAW_PATCH_COUNT" -ne 0 ]; then
            echo "ERRO: ainda existem .3105 crus."
            exit 1
          fi

          echo "========================================"
          echo "SOURCE REMOTE PREPARADA"
          echo "========================================"

      - name: Show Xcode version
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build REMOTE unsigned app
        shell: bash
        run: |
          set -uo pipefail

          rm -rf "$GITHUB_WORKSPACE/build"
          rm -f "$GITHUB_WORKSPACE/xcodebuild.log"

          echo "========================================"
          echo "BUILD REMOTE"
          echo "========================================"

          set +e

          xcodebuild \
            -project "$PROJECT" \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            OBJROOT="$GITHUB_WORKSPACE/build/obj" \
            build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          RC=${PIPESTATUS[0]}

          set -e

          if [ "$RC" -ne 0 ]; then
            echo "========================================"
            echo "BUILD FALHOU"
            echo "========================================"

            grep -n -E \
              'error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift|Ld ' \
              "$GITHUB_WORKSPACE/xcodebuild.log" \
              | tail -n 200 || true

            exit "$RC"
          fi

          echo "========================================"
          echo "BUILD REMOTE CONCLUÍDO"
          echo "========================================"

      - name: Package REMOTE IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(find "$GITHUB_WORKSPACE/build" \
            -type d \
            -name '3105.app' \
            -print \
            -quit)"

          if [ -z "$APP" ]; then
            echo "ERRO: 3105.app não encontrado."
            exit 1
          fi

          EXE="$APP/3105"

          if [ ! -f "$EXE" ]; then
            echo "ERRO: executável 3105 não encontrado."
            exit 1
          fi

          echo "========================================"
          echo "VALIDANDO VAULTS NO EXECUTÁVEL"
          echo "========================================"

          if ! otool -l "$EXE" \
            | grep -q 'sectname __pv3105'; then

            echo "ERRO: __pv3105 não encontrado."
            exit 1
          fi

          echo "__pv3105 OK"

          if ! otool -l "$EXE" \
            | grep -q 'sectname __rv3105'; then

            echo "ERRO: __rv3105 não encontrado."
            exit 1
          fi

          echo "__rv3105 OK"

          strip -S -x "$EXE" || true

          rm -rf "$APP/Patches"
          rm -f "$APP/PkgInfo"

          find "$APP" \
            -maxdepth 1 \
            -type d \
            -name '*.lproj' \
            -exec rm -rf {} +

          RAW_APP="$(
            find "$APP" \
              -type f \
              -name '*.3105' \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$RAW_APP" -ne 0 ]; then
            echo "ERRO: .3105 cru encontrado no app."
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/3105.app

          IPA="3105-REMOTE-UI-1.0.1-unsigned.ipa"

          rm -f "$IPA"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA"

          if [ ! -s "$IPA" ]; then
            echo "ERRO: IPA não foi criada."
            exit 1
          fi

          RAW_IPA="$(
            unzip -l "$IPA" \
              | grep -c '\.3105$' || true
          )"

          if [ "$RAW_IPA" -ne 0 ]; then
            echo "ERRO: .3105 cru encontrado na IPA."
            exit 1
          fi

          echo "========================================"
          echo "IPA REMOTE CRIADA"
          echo "========================================"

          ls -lh "$IPA"

      - name: Upload REMOTE IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-REMOTE-unsigned-ipa
          path: 3105-REMOTE-UI-1.0.1-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-remote-log
          path: xcodebuild.log
          if-no-files-found: ignore
